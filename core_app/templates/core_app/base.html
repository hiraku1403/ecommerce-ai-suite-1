<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce AI Suite - Dashboard Django</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <nav class="bg-slate-800 border-b border-slate-700 p-4 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="{% url 'upload_planilha' %}" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                E-commerce AI Suite
            </a>
            <div class="space-x-4">
                <a href="{% url 'upload_planilha' %}" class="hover:text-emerald-400 transition">Novo Upload</a>
                <a href="{% url 'lista_relatorios' %}" class="hover:text-emerald-400 transition">Histórico no Banco</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 pb-12">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-6 rounded-lg {% if message.tags == 'error' %}bg-rose-900/80 border border-rose-500{% else %}bg-emerald-900/80 border border-emerald-500{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
